<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <title>Your CIASO Journey: Discover, Connect, Equip, Work, Grow, Thrive</title>
  <rect width="1600" height="640" fill="#0B0B0C"/>
  <rect width="1600" height="8" fill="#CD0E00"/>
  <text x="100" y="130" fill="#FF6B5E" font-size="24" font-weight="700" letter-spacing="5">YOUR CIASO JOURNEY</text>
  <text x="100" y="200" fill="#FFFFFF" font-size="58" font-weight="800" letter-spacing="-1">From arrival to opportunity. From opportunity to impact.</text>
  <line x1="150" y1="350" x2="1450" y2="350" stroke="#CD0E00" stroke-width="3"/>
  <g font-weight="800" text-anchor="middle">
    <g transform="translate(150 350)"><circle r="46" fill="#0B0B0C" stroke="#CD0E00" stroke-width="4"/><text y="10" fill="#FF6B5E" font-size="28">01</text><text y="110" fill="#FFF" font-size="30" letter-spacing="3">DISCOVER</text></g>
    <g transform="translate(410 350)"><circle r="46" fill="#0B0B0C" stroke="#CD0E00" stroke-width="4"/><text y="10" fill="#FF6B5E" font-size="28">02</text><text y="110" fill="#FFF" font-size="30" letter-spacing="3">CONNECT</text></g>
    <g transform="translate(670 350)"><circle r="46" fill="#0B0B0C" stroke="#CD0E00" stroke-width="4"/><text y="10" fill="#FF6B5E" font-size="28">03</text><text y="110" fill="#FFF" font-size="30" letter-spacing="3">EQUIP</text></g>
    <g transform="translate(930 350)"><circle r="46" fill="#0B0B0C" stroke="#CD0E00" stroke-width="4"/><text y="10" fill="#FF6B5E" font-size="28">04</text><text y="110" fill="#FFF" font-size="30" letter-spacing="3">WORK</text></g>
    <g transform="translate(1190 350)"><circle r="46" fill="#0B0B0C" stroke="#CD0E00" stroke-width="4"/><text y="10" fill="#FF6B5E" font-size="28">05</text><text y="110" fill="#FFF" font-size="30" letter-spacing="3">GROW</text></g>
    <g transform="translate(1450 350)"><circle r="46" fill="#CD0E00"/><text y="10" fill="#FFF" font-size="28">06</text><text y="110" fill="#FFF" font-size="30" letter-spacing="3">THRIVE</text></g>
  </g>
  <text x="100" y="580" fill="#9A9AA2" font-size="22" font-family="Inter, Arial, sans-serif">Every journey is different. Start at any stage, move at your own pace. · ciaso.ca</text>
</svg>
